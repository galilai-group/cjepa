policy: cjepa/pusht_m1
download: false
device: cuda
seed: 42
output_dir: outputs/pusht

checkpoint:
  repo_id: HazelNam/CJEPA
  revision: main
  backbone: videosaur
  epoch: 30
  filename: null

world:
  env_name: swm/PushT-v1
  image_shape: [224, 224]

dataset:
  name: pusht_expert_train.h5
  cache_dir: null
  normalize: [action, proprio]

plan:
  horizon: 5
  receding_horizon: 5
  action_block: 5
  history_len: 1

solver:
  _target_: stable_worldmodel.solver.CEMSolver
  batch_size: 1
  num_samples: 300
  var_scale: 1.0
  n_steps: 30
  topk: 30
  seed: ${seed}

eval:
  num_eval: 50
  goal_offset: 25
  eval_budget: 50
  image_size: 196
  video: true
  callables:
    - method: _set_state
      args:
        state:
          value: state
    - method: _set_goal_state
      args:
        goal_state:
          value: goal_state

hydra:
  run:
    dir: .
  output_subdir: null
