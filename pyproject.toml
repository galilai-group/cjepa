[project]
name = "cjepa"
version = "0.2.0"
description = "Causal-JEPA world models with object-level latent interventions"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "av>=12",
  "datasets==2.18.0",
  "huggingface-hub>=0.36,<1",
  "moviepy>=1,<2",
  "opencv-python-headless>=4.10",
  "pyarrow==20.0.0",
  "remotezip>=0.12",
  "scipy>=1.14",
  "seaborn>=0.13",
  "stable-worldmodel[env,format,train]==0.1.1",
  "timm==1.0.27",
  "torch==2.5.1",
  "torchvision==0.20.1",
  "webdataset>=0.2",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.11",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
